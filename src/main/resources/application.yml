spring:
  application:
    name: billiard-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-blue-bonus-b4yfazjl-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_lgu8kI2KqvQa}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-local-secret-key-please-change-in-production-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.billiard.app: INFO
    org.springframework.security: WARN
